<script>
(() => {
  const S = STAGE, DUR = 4.916667, $ = (id) => document.getElementById(id);

  const cam = BROLL.make($('plate'), {
    src: 'video-projects/vintage-motor-house/1957-cadillac-eldorado-brougham/stills/06_wheel_close-01.png',
    duration: DUR,
    seed: 79,
    zoom0: 1.02,
    focus: '56% 56%',
    handheld: 0.9,
    grain: 0.22,
    vignette: 0.46,
    shots: [{ t: 0, dur: DUR, move: 'truckR', by: 38, ease: 'inOutSine' }, { t: 0, dur: DUR, move: 'push', by: 0.06, ease: 'inOutSine' }],
    shakes: [{ at: 0.02, power: 0.16, decay: 0.14 }],
  });

  const tl = S.driver(DUR, () => {});
  BROLL.live(tl, cam);

  // furniture that never stops: film-long rail, a light pass, motes
  tl.fromTo($('rail'), { scaleX: 12.4333 / 20.0 }, { scaleX: Math.min(1, 17.3500 / 20.0), duration: DUR, ease: 'none' }, 0);

  const rnd = S.mulberry32(79 * 31 + 7);
  const box = $('motes');
  for (let i = 0; i < 16; i++) {
    const m = document.createElement('div');
    m.className = 'mote';
    const sz = 2 + (rnd() > 0.55 ? 1 : 0);
    m.style.width = sz + 'px';
    m.style.height = sz + 'px';
    m.style.left = Math.round(rnd() * 1890) + 'px';
    m.style.top = Math.round(rnd() * 1050) + 'px';
    box.appendChild(m);
    const rise = 70 + rnd() * 150, dx = (rnd() - 0.5) * 70, t0 = rnd() * 0.6;
    tl.fromTo(m, { opacity: 0 }, { opacity: 0.42, duration: 0.55, ease: 'power1.out' }, t0);
    tl.fromTo(m, { y: 0, x: 0 }, { y: -rise, x: dx, duration: DUR - t0, ease: 'none' }, t0);
    tl.to(m, { opacity: 0, duration: 0.6, ease: 'power1.in' }, Math.max(DUR - 0.6, t0 + 0.6));
  }
  // a light pass every 2.6 s, aligned across cuts
  tl.fromTo($('sweep'), { x: -1500 }, { x: 2100, duration: 1.15, ease: 'none' }, 0.567);
  tl.fromTo($('sweep'), { x: -1500 }, { x: 2100, duration: 1.15, ease: 'none' }, 3.167);

  TX.slam(tl, $('b1'), 0.85);
  TX.slam(tl, $('b2'), 3.40);
  tl.fromTo($('rule'), { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: 'power3.out' }, 3.75);
  TX.words(tl, $('lab'), 3.81, 0.05);

  tl.fromTo($('flash'), { opacity: 1 }, { opacity: 0, duration: 0.16, ease: 'power2.out' }, 0);
  tl.fromTo($('flash'), { opacity: 0 }, { opacity: 1, duration: 0.20, ease: 'power2.in' }, DUR - 0.20);
  window.__timelines = window.__timelines || {};
  window.__timelines['s06-wheel'] = tl;
})();
</script>
