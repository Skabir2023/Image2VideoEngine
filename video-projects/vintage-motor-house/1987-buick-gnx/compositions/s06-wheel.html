<!doctype html>
<!-- SCENE 06 of 6 — full-bleed car plate, camera moving, text cut to the voice. 3.500000 s. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buick GNX — 06 wheel</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/stage.js"></script>
<script src="assets/kit-config.js"></script>
<script src="assets/broll.js"></script>
<script src="assets/text.js"></script>
<link rel="stylesheet" href="assets/fonts.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #050506; }
  #plate { position: absolute; inset: 0; z-index: 0; }
  #fg { position: absolute; inset: 0; z-index: 2; color: #F5EFE6; }
  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 1020px; background: linear-gradient(0deg, rgba(5,5,6,0.96) 0%, rgba(5,5,6,0.84) 40%, rgba(5,5,6,0.52) 76%, rgba(5,5,6,0) 100%); }
  .kick { position: absolute; left: 72px; top: 150px; font: 700 31px/1 'JetBrains Mono', monospace; letter-spacing: 0.30em; color: #EFE8DC; text-shadow: 0 2px 20px rgba(0,0,0,0.92); }
  .b1, .b2 { position: absolute; left: 62px; font: 400 208px/0.90 'Anton', sans-serif; letter-spacing: -0.005em; }
  .b2.small { font-size: 96px; top: auto; }
  .b2.mid { font-size: 148px; }
  .red { color: #E8412B; }
  .rule { position: absolute; left: 68px; width: 190px; height: 3px; background: #E8412B; transform-origin: 0 50%; }
  .lab { position: absolute; left: 68px; font: 700 40px/1 'JetBrains Mono', monospace; letter-spacing: 0.28em; text-shadow: 0 2px 22px rgba(0,0,0,0.95); }
  .foot { position: absolute; left: 68px; font: 500 31px/1.4 'Inter', sans-serif; color: rgba(245,239,230,0.72); text-shadow: 0 2px 18px rgba(0,0,0,0.9); }
  #flash { position: absolute; inset: 0; z-index: 9; background: #F5EFE6; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="s06-wheel" data-start="0" data-duration="3.500000" data-width="1080" data-height="1920">
  <div id="plate" class="clip" data-start="0" data-duration="3.500000" data-track-index="0"></div>
  <div id="fg" class="clip" data-start="0" data-duration="3.500000" data-track-index="1">
    <div class="scrim"></div>
    <div class="b1" id="b1" style="top:1120px">TELL ME</div>
    <div class="b2 red mid" id="b2" style="top:1410px">BELOW</div>
    <div class="rule" id="rule" style="top:1560px"></div>
    <div class="lab" id="lab" style="top:1594px">COMMENTS</div>
  </div>
  <div id="flash" class="clip" data-start="0" data-duration="3.500000" data-track-index="5"></div>
</div>
<script>
(() => {
  const S = STAGE, DUR = 3.500000, $ = (id) => document.getElementById(id);

  const cam = BROLL.make($('plate'), {
    src: 'video-projects/vintage-motor-house/1987-buick-gnx/stills/06_wheel-01.png',
    duration: DUR,
    seed: 79,
    zoom0: 1.02,
    focus: '50% 56%',
    handheld: 1.0,
    grain: 0.25,
    vignette: 0.52,
    shots: [{ t: 0, dur: DUR, move: 'orbitR', by: 46, ease: 'inOutSine' }, { t: 1.43, dur: DUR - 1.43, move: 'push', by: 0.09, ease: 'inOutSine' }],
    shakes: [{ at: 0.03, power: 0.20, decay: 0.12 }, { at: 1.43, power: 0.55, decay: 0.38 }, { at: 1.92, power: 0.30, decay: 0.30 }],
  });

  const tl = S.driver(DUR, () => {});
  BROLL.live(tl, cam);

  TX.slam(tl, $('b1'), 0.28);
  TX.slam(tl, $('b2'), 0.44);
  tl.fromTo($('rule'), { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: 'power3.out' }, 1.00);
  TX.words(tl, $('lab'), 1.08, 0.04);

  tl.fromTo($('flash'), { opacity: 1 }, { opacity: 0, duration: 0.16, ease: 'power2.out' }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines['s06-wheel'] = tl;
})();
</script>
</body>
</html>
